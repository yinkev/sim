{{- if and .Values.mothership.enabled .Values.mothership.server.secret.create (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sim.mothership.envSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sim.mothership.labels" . | nindent 4 }}
  {{- with .Values.mothership.server.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.mothership.server.env }}
  {{- if and (ne (toString $value) "") (ne (toString $value) "<nil>") }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
